<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0b29"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="neonMix" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyanStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b1"/>
      <feGaussianBlur stdDeviation="7" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="120" height="120" rx="26" fill="url(#bgGrad)"/>
  <!-- Subtle tech ring -->
  <rect width="118" height="118" x="1" y="1" rx="25" fill="none" stroke="#312e81" stroke-width="1" opacity="0.8"/>

  <!-- Backdrop radial glow -->
  <ellipse cx="60" cy="60" rx="50" ry="40" fill="#38bdf8" opacity="0.08" filter="url(#glowBlue)"/>

  <!-- Brackets < > (Web Dev) -->
  <path d="M 18 60 L 38 32 L 38 40 L 24 60 L 38 80 L 38 88 L 18 60 Z"
        fill="none" stroke="url(#neonMix)" stroke-width="2" stroke-linejoin="round"
        filter="url(#glowCyan)" opacity="0.9"/>
  <path d="M 102 60 L 82 32 L 82 40 L 96 60 L 82 80 L 82 88 L 102 60 Z"
        fill="none" stroke="url(#neonMix)" stroke-width="2" stroke-linejoin="round"
        filter="url(#glowCyan)" opacity="0.9"/>

  <!-- ====== MONOGRAM O E J ====== -->
  <g transform="translate(30, 24)">

    <!-- O — Workflow Node Circle -->
    <g transform="translate(0, 0)">
      <!-- Outer workflow ring -->
      <circle cx="20" cy="36" r="18" fill="none" stroke="url(#cyanGrad)" stroke-width="2"
              filter="url(#glowCyan)" opacity="0.9"/>
      <!-- Inner letter O -->
      <circle cx="20" cy="36" r="11" fill="none" stroke="#38bdf8" stroke-width="3.2"
              stroke-linecap="round" filter="url(#glowCyanStrong)"/>
      <!-- Node pins (n8n style) -->
      <circle cx="20" cy="20" r="2" fill="#38bdf8" filter="url(#glowCyan)"/>
      <circle cx="20" cy="52" r="2" fill="#38bdf8" filter="url(#glowCyan)"/>
      <circle cx="4" cy="36" r="2" fill="#2563eb" filter="url(#glowBlue)"/>
      <circle cx="36" cy="36" r="2" fill="#2563eb" filter="url(#glowBlue)"/>
    </g>

    <!-- E — Code / Angular -->
    <g transform="translate(30, 10)" filter="url(#glowCyan)">
      <line x1="5" y1="0" x2="5" y2="52" stroke="url(#neonMix)" stroke-width="3.6" stroke-linecap="round"/>
      <line x1="5" y1="2" x2="34" y2="2" stroke="url(#cyanGrad)" stroke-width="3.6" stroke-linecap="round"/>
      <line x1="5" y1="27" x2="30" y2="27" stroke="url(#neonMix)" stroke-width="3.6" stroke-linecap="round"/>
      <line x1="5" y1="51" x2="34" y2="51" stroke="url(#cyanGrad)" stroke-width="3.6" stroke-linecap="round"/>
      <!-- Node dots -->
      <circle cx="34" cy="2" r="1.8" fill="#38bdf8" filter="url(#glowCyan)"/>
      <circle cx="30" cy="27" r="1.8" fill="#2563eb" filter="url(#glowBlue)"/>
      <circle cx="34" cy="51" r="1.8" fill="#38bdf8" filter="url(#glowCyan)"/>
    </g>

    <!-- J — AI Flowing Neural -->
    <g transform="translate(64, 10)">
      <line x1="5" y1="2" x2="5" y2="38" stroke="url(#neonMix)" stroke-width="3.6" stroke-linecap="round"
            filter="url(#glowCyan)"/>
      <path d="M 5 38 C 5 50, 5 54, 16 54 C 27 54, 30 50, 31 43"
            fill="none" stroke="url(#blueGrad)" stroke-width="3.6" stroke-linecap="round"
            filter="url(#glowCyanStrong)"/>
      <!-- AI nodes + sparks -->
      <circle cx="5" cy="2" r="2" fill="#38bdf8" filter="url(#glowCyan)"/>
      <circle cx="5" cy="38" r="1.6" fill="#22d3ee" filter="url(#glowCyan)"/>
      <circle cx="17" cy="54" r="1.6" fill="#2563eb" filter="url(#glowBlue)"/>
      <circle cx="31" cy="43" r="2.1" fill="#6366f1" filter="url(#glowBlue)"/>
      <line x1="31" y1="43" x2="38" y2="37" stroke="#67e8f9" stroke-width="0.9" filter="url(#glowCyan)"/>
      <line x1="31" y1="43" x2="37" y2="47" stroke="#38bdf8" stroke-width="0.9" filter="url(#glowCyan)"/>
    </g>

    <!-- Central AI nexus dot -->
    <g transform="translate(45, 60)">
      <circle r="3" fill="url(#neonMix)" filter="url(#glowCyanStrong)"/>
      <circle r="5.5" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.6" filter="url(#glowCyan)"/>
    </g>
  </g>
</svg>
